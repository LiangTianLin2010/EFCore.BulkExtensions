name: Publish to NuGet

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0'

    - name: Build and Pack all projects
      run: |
        # 主项目
        dotnet pack EFCore.BulkExtensions/EFCore.BulkExtensions.csproj -c Release -o out
        
        # 子项目：MySql
        dotnet pack EFCore.BulkExtensions.MySql/EFCore.BulkExtensions.MySql.csproj -c Release -o out
        
        # 子项目：Oracle
        dotnet pack EFCore.BulkExtensions.Oracle/EFCore.BulkExtensions.Oracle.csproj -c Release -o out
        
        # 子项目：PostgreSql
        dotnet pack EFCore.BulkExtensions.PostgreSql/EFCore.BulkExtensions.PostgreSql.csproj -c Release -o out
        
        # 子项目：Sqlite
        dotnet pack EFCore.BulkExtensions.Sqlite/EFCore.BulkExtensions.Sqlite.csproj -c Release -o out
        
        # 子项目：SqlServer
        dotnet pack EFCore.BulkExtensions.SqlServer/EFCore.BulkExtensions.SqlServer.csproj -c Release -o out
        
        # 子项目：GBase
        dotnet pack EFCore.BulkExtensions.GBase/EFCore.BulkExtensions.GBase.csproj -c Release -o out
        
        # 子项目：Core
        dotnet pack EFCore.BulkExtensions.Core/EFCore.BulkExtensions.Core.csproj -c Release -o out

    - name: List output files
      run: ls -la out/

    - name: NuGet Login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to NuGet
      run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
