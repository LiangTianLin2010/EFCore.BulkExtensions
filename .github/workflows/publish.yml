name: Publish to NuGet

on:
  release:
    types: [published]  # 当你在GitHub上发布一个Release时触发

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: release  # 与NuGet策略中的Environment对应
    permissions:
      id-token: write    # 【关键】允许此job获取OIDC令牌
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0' # 替换为你需要的.NET版本

    - name: Build and Pack
      run: |
        dotnet pack YourProject.csproj -c Release -o out

    # 【核心】使用NuGet/login@v1获取临时的、短期的API密钥
    - name: NuGet Login (OIDC)
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{ secrets.NUGET_USER }}  # 引用你刚创建的secret

    # 使用上一步获取的临时密钥推送包
    - name: Push to NuGet
      run: dotnet nuget push out/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
